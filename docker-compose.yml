version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: club-db
    environment:
      POSTGRES_DB: club
      POSTGRES_USER: club_user
      POSTGRES_PASSWORD: club_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: